<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tablatura</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #1e1e2e;
    --gold: #e8c84a;
    --label-e: #e85a5a;
    --label-b: #e88a3a;
    --label-g: #e8c84a;
    --label-d: #4ae87a;
    --label-a: #4aaae8;
    --label-E: #a06af0;
    --ch: 22px;
    --fs: 11px;
    --cw: 11px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    padding: 16px 10px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.9rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-shadow: 0 0 20px #e8c84a55;
  }

  header p {
    color: #33334a;
    font-size: 0.58rem;
    letter-spacing: 0.4em;
    margin-top: 2px;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 480px;
    margin: 0 auto;
  }

  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 8px 10px;
    position: relative;
    overflow: hidden;
  }

  .section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity: 0.3;
  }

  .sec-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.45em;
    color: var(--gold);
    opacity: 0.4;
    margin-bottom: 6px;
  }

  .tab-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tab-scroll::-webkit-scrollbar { display: none; }

  .tab-block {
    display: inline-flex;
    flex-direction: column;
  }

  .string-row {
    display: flex;
    align-items: center;
    height: var(--ch);
    border-bottom: 1px solid #13131d;
  }
  .string-row:last-child { border-bottom: none; }

  .sname {
    width: 14px;
    font-size: 9px;
    font-weight: bold;
    text-align: right;
    padding-right: 3px;
    flex-shrink: 0;
    line-height: var(--ch);
  }
  .sname.e  { color: var(--label-e); }
  .sname.B  { color: var(--label-b); }
  .sname.G  { color: var(--label-g); }
  .sname.D  { color: var(--label-d); }
  .sname.A  { color: var(--label-a); }
  .sname.EL { color: var(--label-E); }

  .line-wrap {
    position: relative;
    display: flex;
    align-items: center;
    height: var(--ch);
  }

  .line-bg {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background: #222238;
    transform: translateY(-50%);
  }

  .chars {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
  }

  .c {
    display: inline-block;
    width: var(--cw);
    text-align: center;
    font-size: var(--fs);
    line-height: var(--ch);
    color: #1a1a2a;
  }

  .c.note {
    color: var(--gold);
    font-weight: bold;
    text-shadow: 0 0 5px #e8c84aaa;
  }

  .c.wide { width: 18px; }
</style>
</head>
<body>

<header>
  <h1>GUITAR TAB</h1>
  <p>← DESLIZA PARA VER MÁS →</p>
</header>

<div class="grid" id="grid"></div>

<script>
const ALL_SECTIONS = [
  // primera parte del riff original (primera sección)
  {
    label: 'SECCIÓN 1',
    strings: [
      { n:'e', cls:'e', s:'--6-6--6-6-6-6-6' },
      { n:'B', cls:'B', s:'------------------6--4' },
      { n:'G', cls:'G', s:'-----------------------------------------------------' },
      { n:'D', cls:'D', s:'-----------------------------------------------------' },
      { n:'A', cls:'A', s:'-----------------------------------------------------' },
      { n:'E', cls:'EL',s:'-----------------------------------------------------' },
    ]
  },
  // segunda parte del riff original (nueva sección 2)
  {
    label: 'SECCIÓN 2',
    strings: [
      { n:'e', cls:'e', s:'--5-5--5-5-5-5-5------' },
      { n:'B', cls:'B', s:'------ -----------4--3-' },
      { n:'G', cls:'G', s:'-----------------------------------------------------' },
      { n:'D', cls:'D', s:'-----------------------------------------------------' },
      { n:'A', cls:'A', s:'-----------------------------------------------------' },
      { n:'E', cls:'EL',s:'-----------------------------------------------------' },
    ]
  },
  // antigua sección 2 pasa a ser sección 3
  {
    label: 'SECCIÓN 3',
    strings: [
      { n:'e', cls:'e', s:'--3-3--3-3-3-----------' },
      { n:'B', cls:'B', s:'--------------6-6------' },
      { n:'G', cls:'G', s:'-------------------5--2' },
      { n:'D', cls:'D', s:'-----------------------' },
      { n:'A', cls:'A', s:'-----------------------' },
      { n:'E', cls:'EL',s:'-----------------------' },
    ]
  },
  // sección 3 original -> ahora 4
  {
    label: 'SECCIÓN 4',
    strings: [
      { n:'e', cls:'e', s:'------------5-6-8-10-8-6-8-6-------' },
      { n:'B', cls:'B', s:'--6-6--8-10------------------8--------' },
      { n:'G', cls:'G', s:'-------------------------------------' },
      { n:'D', cls:'D', s:'-------------------------------------' },
      { n:'A', cls:'A', s:'-------------------------------------' },
      { n:'E', cls:'EL',s:'-------------------------------------' },
    ]
  },
  // sección 4 original -> ahora 5
  {
    label: 'SECCIÓN 5',
    strings: [
      { n:'e', cls:'e', s:'--10-10-10-8-8-8-6-6-6-5-5-5--5-3-3--3-----------' },
      { n:'B', cls:'B', s:'---------------------------------------6-6--6-6-8--8-8-10' },
      { n:'G', cls:'G', s:'--------------------------------------------------' },
      { n:'D', cls:'D', s:'--------------------------------------------------' },
      { n:'A', cls:'A', s:'--------------------------------------------------' },
      { n:'E', cls:'EL',s:'--------------------------------------------------' },
    ]
  },
  // sección 5 original -> ahora 6
  {
    label: 'SECCIÓN 6',
    strings: [
      { n:'e', cls:'e', s:'--5-5-8-6--' },
      { n:'B', cls:'B', s:'-----------' },
      { n:'G', cls:'G', s:'-----------' },
      { n:'D', cls:'D', s:'-----------' },
      { n:'A', cls:'A', s:'-----------' },
      { n:'E', cls:'EL',s:'-----------' },
    ]
  },
];


function tokenize(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    if (s[i] >= '0' && s[i] <= '9') {
      let num = '';
      while (i < s.length && s[i] >= '0' && s[i] <= '9') num += s[i++];
      tokens.push({ type: 'note', val: num });
    } else {
      tokens.push({ type: 'dash', val: s[i++] });
    }
  }
  return tokens;
}

function buildSection(sec) {
  const tokenized = sec.strings.map(str => tokenize(str.s));
  const maxLen = Math.max(...tokenized.map(t => t.reduce((a, tok) => a + tok.val.length, 0)));

  const div = document.createElement('div');
  div.className = 'section';
  div.innerHTML = `<div class="sec-label">${sec.label}</div>`;

  const scroll = document.createElement('div');
  scroll.className = 'tab-scroll';

  const block = document.createElement('div');
  block.className = 'tab-block';

  sec.strings.forEach((str, si) => {
    const row = document.createElement('div');
    row.className = 'string-row';

    const sname = document.createElement('div');
    sname.className = `sname ${str.cls}`;
    sname.textContent = str.n;
    row.appendChild(sname);

    const wrap = document.createElement('div');
    wrap.className = 'line-wrap';

    const bg = document.createElement('div');
    bg.className = 'line-bg';
    wrap.appendChild(bg);

    const chars = document.createElement('div');
    chars.className = 'chars';

    const toks = tokenized[si];
    let used = toks.reduce((a, t) => a + t.val.length, 0);
    const padded = [...toks];
    while (used < maxLen) { padded.push({ type: 'dash', val: '-' }); used++; }

    padded.forEach(tok => {
      const span = document.createElement('span');
      const isWide = tok.val.length === 2;
      span.className = (tok.type === 'note' ? 'c note' : 'c') + (isWide ? ' wide' : '');
      span.textContent = tok.val;
      chars.appendChild(span);
    });

    wrap.appendChild(chars);
    row.appendChild(wrap);
    block.appendChild(row);
  });

  scroll.appendChild(block);
  div.appendChild(scroll);
  return div;
}

const grid = document.getElementById('grid');
ALL_SECTIONS.forEach(sec => grid.appendChild(buildSection(sec)));
</script>
</body>
</html>
